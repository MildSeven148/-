/* ===== 页面错误捕获：把详细错误信息显示在页面上，便于排查 ===== */
var LF_LOGS = [];
window.__LF_LOGS = LF_LOGS;
(function () {
  var origErr = console.error.bind(console);

const CONTENT = { en: EN, ja: JA, ko: KO };

const COURSES = [];
const LESSONS = [];

LANGUAGES.filter((l) => !l.comingSoon).forEach((lang) => {
  const bank = CONTENT[lang.id];
  LEVELS.forEach((level) => {
    const courseId = lang.id + '-' + level.id;
    const words = bank.words[level.id];
    const grammar = bank.grammar[level.id];
    const listening = bank.listening[level.id];
    const speaking = bank.speaking[level.id];

    const fullContent = { words: words, grammar: grammar, listening: listening, speaking: speaking };
    const lessonDefs = [
      { type: 'vocab', title: level.name + ' · 核心词汇', subtitle: words.length + ' 个高频单词闪卡速记', content: fullContent },
      { type: 'grammar', title: level.name + ' · 实用语法', subtitle: '「' + grammar.title + '」规则精讲与练习', content: fullContent },
      { type: 'listening', title: level.name + ' · 听力训练', subtitle: '「' + listening.title + '」情景对话理解', content: fullContent },
      { type: 'speaking', title: level.name + ' · 口语跟读', subtitle: '「' + speaking.prompt + '」跟读训练', content: fullContent },
    ];

    const lessonIds = [];
    lessonDefs.forEach((def, i) => {
      const id = courseId + '-l' + (i + 1);
      lessonIds.push(id);
      LESSONS.push({ id: id, courseId: courseId, languageId: lang.id, levelId: level.id, type: def.type, title: def.title, subtitle: def.subtitle, featured: true, content: def.content, order: i + 1 });
    });

    COURSES.push({
      id: courseId,
      languageId: lang.id,
      levelId: level.id,
      title: lang.name + ' · ' + level.name,
      tagline: level.tag + '：' + level.desc,
      lessons: lessonIds,
      totalXp: 120,
    });
  });
});

const recommendCourses = function (user) {

  const startIdx = bias.indexOf(user.levelId) === -1 ? 0 : bias.indexOf(user.levelId);

<script type="text/babel" data-presets="react">
/* ===== 模拟后端（localStorage 持久化）===== */
const DB_KEY = 'linguaflow_db_v4';

const loadDB = function () {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const db = JSON.parse(raw);
      if (db && db.users && db.posts) return db;
    }
  } catch (e) {}
  const db = {
    users: [],
    posts: JSON.parse(JSON.stringify(SEED_POSTS)).map(function (p) {
      return { ...p, baseLikes: p.likes || 0, likedBy: [], comments: (p.comments || []).map(function (c) { return { ...c, likedBy: [] }; }) };
    }),
    nextId: 1,
  };
  saveDB(db);
  return db;
};

const saveDB = function (db) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) {}
};

const uid = function () {
  return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
};

const refreshBadges = function (progress) {
  const ctx = { ...progress.stats, xp: progress.xp, streak: progress.streak };
  const earned = BADGES.filter(function (b) { return b.check(ctx); }).map(function (b) { return b.id; });
  progress.badges = Array.from(new Set(progress.badges.concat(earned)));
  return progress;
};

const applyStreak = function (progress) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayStr = today.toDateString();
  const last = progress.lastStudyDate ? new Date(progress.lastStudyDate) : null;
  if (last) last.setHours(0, 0, 0, 0);
  if (progress.lastStudyDate !== todayStr) {
    if (last && today - last === 86400000) progress.streak += 1;
    else progress.streak = 1;
    progress.lastStudyDate = todayStr;
  }
  return progress;
};

const updateWeek = function (progress) {
  const wd = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'][new Date().getDay()];
  progress.week[wd] = (progress.week[wd] || 0) + 1;
};

/* ===== 语音朗读 ===== */
const speak = function (text, lang, rate) {
  if (!('speechSynthesis' in window)) return false;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    u.rate = rate || 1;
    const voices = window.speechSynthesis.getVoices();
    if (voices.length) {
      const prefix = (lang || 'en-US').split('-')[0].toLowerCase();
      const v = voices.find(function (x) { return x.lang.replace('_', '-').toLowerCase().startsWith(prefix); });
      if (v) u.voice = v;
    }
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) {
    return false;
  }
};

const stopSpeak = function () {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
};

/* ===== 全局状态 ===== */
const AppCtx = createContext(null);
const SESSION_KEY = 'linguaflow_session';

const AppProvider = function ({ children }) {
  const [db, setDb] = useState(loadDB);
  const [currentUserId, setCurrentUserId] = useState(function () { return localStorage.getItem(SESSION_KEY); });
  const [toasts, setToasts] = useState([]);

  const persist = function (next) {
    setDb(next);
    saveDB(next);
  };

  const showToast = useCallback(function (msg, type) {
    const id = Date.now() + Math.random();
    setToasts(function (t) { return t.concat([{ id: id, msg: msg, type: type || 'info' }]); });
    setTimeout(function () { setToasts(function (t) { return t.filter(function (x) { return x.id !== id; }); }); }, 2800);
  }, []);

  const currentUser = db.users.find(function (u) { return u.id === currentUserId; }) || null;

  const register = function ({ name, email, password }) {
    if (db.users.some(function (u) { return u.email.toLowerCase() === email.toLowerCase(); })) {
      throw new Error('该邮箱已注册，请直接登录');
    }
    const user = {
      id: uid(),
      name: name,
      email: email,
      password: password,
      avatar: (name.trim().slice(0, 1).toUpperCase()) || '语',
      langId: 'en',
      levelId: 'starter',
      personaId: 'interest',
      joinedAt: Date.now(),
      progress: defaultProgress(),
    };
    persist({ ...db, users: db.users.concat([user]) });
    setCurrentUserId(user.id);
    localStorage.setItem(SESSION_KEY, user.id);
    return user;
  };

  const login = function ({ email, password }) {
    const u = db.users.find(function (x) { return x.email.toLowerCase() === email.toLowerCase(); });
    if (!u || u.password !== password) {
      throw new Error('邮箱或密码不正确，请重试');
    }
    setCurrentUserId(u.id);
    localStorage.setItem(SESSION_KEY, u.id);
    return u;
  };

  const logout = function () {
    setCurrentUserId(null);
    localStorage.removeItem(SESSION_KEY);
  };

  const updateProfile = function (patch) {
    if (!currentUser) return;
    persist({ ...db, users: db.users.map(function (u) { return u.id === currentUser.id ? { ...u, ...patch } : u; }) });
  };

  const recordActivity = function ({ lessonId, completeLesson, xp, words, grammar, listening, speaking, minutes }) {
    if (!currentUser) return [];
    const prev = currentUser.progress;
    const p = {
      ...prev,
      completed: prev.completed.slice(),
      stats: { ...prev.stats },
      week: { ...prev.week },
      badges: prev.badges.slice(),
    };
    p.xp += xp || 0;
    p.studyMins += minutes || 1;
    p.stats.words += words || 0;
    p.stats.grammar += grammar || 0;
    p.stats.listening += listening || 0;
    p.stats.speaking += speaking || 0;
    if (completeLesson && lessonId && p.completed.indexOf(lessonId) < 0) {
      p.completed.push(lessonId);
      p.stats.lessons += 1;
    }
    applyStreak(p);
    updateWeek(p);
    refreshBadges(p);
    const newBadges = p.badges.filter(function (b) { return prev.badges.indexOf(b) < 0; });
    const updated = { ...currentUser, progress: p };
    persist({ ...db, users: db.users.map(function (u) { return u.id === currentUser.id ? updated : u; }) });
    return newBadges;
  };

  const toggleLike = function (postId) {
    if (!currentUser) return;
    const posts = db.posts.map(function (p) {
      if (p.id !== postId) return p;
      const has = p.likedBy.indexOf(currentUser.id) >= 0;
      return { ...p, likedBy: has ? p.likedBy.filter(function (x) { return x !== currentUser.id; }) : p.likedBy.concat([currentUser.id]) };
    });
    persist({ ...db, posts: posts });
  };

  const addPost = function (text) {
    if (!currentUser) return;
    const post = {
      id: uid(),
      authorId: currentUser.id,
      authorName: currentUser.name,
      avatar: currentUser.avatar,
      time: '刚刚',
      text: text,
      baseLikes: 0,
      likedBy: [],
      comments: [],
    };
    const prev = currentUser.progress;
    const p = { ...prev, stats: { ...prev.stats, posts: prev.stats.posts + 1 }, badges: prev.badges.slice() };
    refreshBadges(p);
    persist({ ...db, posts: [post].concat(db.posts), users: db.users.map(function (u) { return u.id === currentUser.id ? { ...u, progress: p } : u; }) });
    const newBadges = p.badges.filter(function (b) { return prev.badges.indexOf(b) < 0; });
    return newBadges;
  };

  const addComment = function (postId, text) {
    if (!currentUser || !text.trim()) return;
    const comment = {
      id: uid(),
      authorId: currentUser.id,
      authorName: currentUser.name,
      avatar: currentUser.avatar,
      time: '刚刚',
      text: text.trim(),
    };
    persist({ ...db, posts: db.posts.map(function (p) { return p.id === postId ? { ...p, comments: p.comments.concat([comment]) } : p; }) });
  };

  return React.createElement(
    AppCtx.Provider,
    { value: { db: db, currentUser: currentUser, toasts: toasts, showToast: showToast, register: register, login: login, logout: logout, updateProfile: updateProfile, recordActivity: recordActivity, toggleLike: toggleLike, addPost: addPost, addComment: addComment } },
    children
  );
};

const useApp = function () { return useContext(AppCtx); };
</script>

/* PCM 采样编码为 WAV（任何浏览器均可播放） */
function encodeWav(samples, sampleRate) {
  const n = samples.length;
  const buffer = new ArrayBuffer(44 + n * 2);
  const view = new DataView(buffer);
  const writeStr = function (offset, s) {
    for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
  };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + n * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, n * 2, true);
  let offset = 44;
  for (let i = 0; i < n; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    offset += 2;
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

const SpeakingPlayer = function ({ content, lang, onFinish }) {
  const supported = typeof navigator !== 'undefined' && !!navigator.mediaDevices && !!navigator.mediaDevices.getUserMedia && typeof (window.AudioContext || window.webkitAudioContext) === 'function';

  const [recording, setRecording] = useState(false);
  const [audioUrl, setAudioUrl] = useState(null);
  const [dur, setDur] = useState(0);
  const [recMsg, setRecMsg] = useState('');
  const [result, setResult] = useState(null);
  const [attempts, setAttempts] = useState(0);
  const streamRef = useRef(null);
  const t0Ref = useRef(0);
  const audioRef = useRef(null);
  const ctxRef = useRef(null);
  const sourceRef = useRef(null);
  const procRef = useRef(null);
  const samplesRef = useRef([]);
  const peakRef = useRef(0);
  const finishedRef = useRef(false);

  if (!content || !content.reference) {
    return (
      <div className="empty">
        <div className="e-icon">🎙️</div>
        <b>本节暂无口语跟读</b>
        <p style={{ marginTop: 6, fontSize: 13.5 }}>可在本课的「主推模块」中完成核心练习</p>
      </div>
    );
  }

  const startRec = async function () {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      streamRef.current = stream;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error('no-audio');
      if (!ctxRef.current) ctxRef.current = new AC();
      const ctx = ctxRef.current;
      if (ctx.state === 'suspended') await ctx.resume();
      const source = ctx.createMediaStreamSource(stream);
      const proc = ctx.createScriptProcessor(4096, 1, 1);
      const zeroGain = ctx.createGain();
      zeroGain.gain.value = 0;
      source.connect(proc);
      proc.connect(zeroGain);
      zeroGain.connect(ctx.destination);
      sourceRef.current = source;
      procRef.current = proc;
      samplesRef.current = [];
      peakRef.current = 0;
      t0Ref.current = Date.now();
      proc.onaudioprocess = function (e) {
        const data = e.inputBuffer.getChannelData(0);
        const copy = new Float32Array(data.length);
        let p = peakRef.current;
        for (let i = 0; i < data.length; i++) {
          const v = data[i];
          copy[i] = v;
          const a = v < 0 ? -v : v;
          if (a > p) p = a;
        }
        peakRef.current = p;
        samplesRef.current.push(copy);
      };
      setRecording(true);
    } catch (e) {
      setResult({ msg: '无法访问麦克风，请在浏览器设置中允许后重试，或使用"直接跟读"模式。', score: null });
    }
  };

  const stopRec = function () {
    const proc = procRef.current;
    const source = sourceRef.current;
    if (proc) proc.disconnect();
    if (source) source.disconnect();
    if (streamRef.current) streamRef.current.getTracks().forEach(function (t) { t.stop(); });
    procRef.current = null;
    sourceRef.current = null;
    setRecording(false);

    const raw = samplesRef.current;
    let len = 0;
    for (let i = 0; i < raw.length; i++) len += raw[i].length;
    const all = new Float32Array(len);
    let off = 0;
    for (let i = 0; i < raw.length; i++) { all.set(raw[i], off); off += raw[i].length; }
    const secs = (Date.now() - t0Ref.current) / 1000;
    setDur(secs);
    setResult(null);
    if (len < 800 || peakRef.current < 0.02) {
      setRecMsg('未检测到有效声音（请确认麦克风已授权且未静音，并对着麦克风说话）');
      setAudioUrl(null);
    } else {
      const sr = (ctxRef.current && ctxRef.current.sampleRate) || 44100;
      setRecMsg('');
      setAudioUrl(URL.createObjectURL(encodeWav(all, sr)));
    }
  };

  const complete = function () {
    if (finishedRef.current) return;
    finishedRef.current = true;
    const secs = audioUrl ? dur : 0;
    const score = audioUrl ? Math.round(Math.min(72 + secs * 2.2, 94) + Math.random() * 3) : null;
    setResult({
      score: score,
      msg: audioUrl ? (secs >= 3 ? '跟读流畅，节奏自然，继续保持！' : '发音完整，建议再慢一点、字正腔圆一些。') : '跟读完成！建议结合参考发音再对比一遍。',
    });
    setAttempts(function (a) { return a + 1; });
    if (onFinish) onFinish();
  };

  const retry = function () {
    finishedRef.current = false; setAudioUrl(null); setDur(0); setResult(null); setRecMsg('');
  };

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
        <span className="pill pill-brand">🎙️ 跟读任务</span>
        <h3 style={{ fontSize: 18 }}>{content.prompt}</h3>
      </div>
      <div className="card" style={{ padding: 24, textAlign: 'center', marginBottom: 16, background: 'var(--bg)' }}>
        <div style={{ fontSize: 21, fontWeight: 800, lineHeight: 1.7 }}>{content.reference}</div>
        <div style={{ display: 'flex', gap: 8, justifyContent: 'center', marginTop: 14, flexWrap: 'wrap' }}>
          <button className="btn btn-primary btn-sm" onClick={() => speak(content.reference, lang, 0.85)}>🔊 慢速示范</button>
          <button className="btn btn-ghost btn-sm" onClick={() => speak(content.reference, lang, 1)}>🔊 常速示范</button>
          <button className="btn btn-ghost btn-sm" onClick={stopSpeak}>⏹ 停止</button>
        </div>
        <div style={{ display: 'flex', gap: 6, justifyContent: 'center', marginTop: 12, flexWrap: 'wrap' }}>
          {(content.keywords || []).map(function (k) { return <span key={k} className="tag" style={{ background: 'var(--brand-soft)', color: 'var(--brand)' }}>{k}</span>; })}
        </div>
      </div>
      <div className="center" style={{ margin: '20px 0' }}>
        {!audioUrl ? (
          <div>
            <button className={'rec-btn' + (recording ? ' recording' : '')} style={recording ? { background: 'var(--err)' } : {}} onClick={recording ? stopRec : startRec} disabled={!supported} title={supported ? '点击开始/停止录音' : '浏览器不支持录音'}>
              {recording ? '⏹' : '🎤'}
            </button>
            <p className="muted" style={{ fontSize: 12.5, marginTop: 10 }}>{recording ? '正在录音，再次点击停止' : '点击麦克风开始跟读录音'}</p>
          </div>
        ) : (
          <div>
            <audio ref={audioRef} controls src={audioUrl} style={{ width: '100%', maxWidth: 360 }} />
            {recMsg && <p className="muted" style={{ fontSize: 12.5, marginTop: 6, color: 'var(--warn)' }}>{recMsg}</p>}
            <p className="muted" style={{ fontSize: 12.5, marginTop: 8 }}>录音 {dur.toFixed(1)} 秒 · 听听自己的发音</p>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginTop: 10, flexWrap: 'wrap' }}>
              <button className="btn btn-primary btn-sm" onClick={function () { if (audioRef.current) audioRef.current.play(); }}>🔊 播放我的录音</button>
              <button className="btn btn-ghost btn-sm" onClick={() => speak(content.reference, lang, 0.85)}>🔊 再听示范</button>
              <button className="btn btn-ghost btn-sm" onClick={retry}>↺ 重新跟读</button>
            </div>
          </div>
        )}
        {!supported && <p className="muted" style={{ fontSize: 12.5, marginTop: 8 }}>当前浏览器不支持录音，可大声朗读参考句后直接提交跟读。</p>}
      </div>
      {!result && (
        <div className="center">
          <button className="btn btn-primary" onClick={complete} disabled={!audioUrl && !supported}>我读好了，提交跟读 ✓</button>
        </div>
      )}
      {result && (
        <div className="feedback ok" style={{ textAlign: 'center' }}>
          {result.score !== null ? (
            <div>
              <div style={{ fontSize: 26, fontWeight: 800, marginBottom: 4 }}>发音评分 {result.score} 分</div>
              <div style={{ fontSize: 14 }}>{result.msg}</div>
              <div className="muted" style={{ fontSize: 12.5, marginTop: 8 }}>小贴士：{content.tip}</div>
              <button className="btn btn-ghost btn-sm" style={{ marginTop: 12 }} onClick={retry}>↺ 再来一次，挑战更高分</button>
            </div>
          ) : (
            <div style={{ fontSize: 14 }}>{result.msg}</div>
          )}
        </div>
      )}
    </div>
  );
};

  const [step, setStep] = useState(1);
  const [langId, setLangId] = useState(currentUser ? currentUser.langId : 'en');
  const [levelId, setLevelId] = useState(currentUser ? currentUser.levelId : 'starter');
  const [personaId, setPersonaId] = useState(presetPersona || (currentUser ? currentUser.personaId : 'interest'));

  const [assessOpen, setAssessOpen] = useState(false);
  const [answers, setAnswers] = useState(ASSESS.map(function () { return -1; }));
  const [assessScore, setAssessScore] = useState(null);

  useEffect(function () {
    if (!currentUser) navigate('/register');
  }, [currentUser, navigate]);

  const finishAssess = function () {
    if (answers.some(function (a) { return a < 0; })) return;
    const score = answers.reduce(function (s, a) { return s + a; }, 0);
    const lv = assessToLevel(score);
    setAssessScore(score);
    setLevelId(lv);
    setAssessOpen(false);
    showToast('测评完成！为你推荐能力起点：' + LEVELS.find(function (l) { return l.id === lv; }).name, 'info');
  };

  const finish = function () {
    updateProfile({ langId: langId, levelId: levelId, personaId: personaId });
    showToast('画像已生成，个性化学习路径已就绪 ✨', 'success');
    navigate('/dashboard');
  };

  const persona = PERSONAS.find(function (p) { return p.id === personaId; });
  const level = LEVELS.find(function (l) { return l.id === levelId; });

  return (
    <div className="container page" style={{ maxWidth: 900, padding: '48px 24px 72px' }}>
      <div className="center" style={{ marginBottom: 30 }}>
        <div className="logo-big">🌊</div>
        <h1 style={{ fontSize: 28, marginTop: 8 }}>完成画像，定制你的学习路径</h1>
        <p className="muted" style={{ marginTop: 6 }}>仅需 3 步，让我们更懂你</p>
      </div>
      <div className="steps">
        {[1, 2, 3].map(function (s) {
          return (
            <div key={s} style={{ display: 'contents' }}>
              <div className={'step ' + (step === s ? 'active' : step > s ? 'done' : '')}>
                <span className="s-dot">{step > s ? '✓' : s}</span>
                {s === 1 ? '选择语言' : s === 2 ? '能力分层' : '精准画像'}
              </div>
              {s < 3 && <div className="step-line" />}
            </div>
          );
        })}
      </div>

      {step === 1 && (
        <div>
          <div className="grid" style={{ gridTemplateColumns: 'repeat(3, 1fr)' }}>
            {LANGUAGES.filter(function (l) { return !l.comingSoon; }).map(function (l) {
              return (
                <button key={l.id} className={'pick-card' + (langId === l.id ? ' sel' : '')} onClick={function () { setLangId(l.id); }}>
                  <div className="pk-icon">{l.flag}</div><b>{l.name}</b><span>{l.native}</span>
                </button>
              );
            })}
          </div>
          <div style={{ marginTop: 30, textAlign: 'center' }}><button className="btn btn-primary btn-lg" onClick={function () { setStep(2); }}>下一步：能力分层 →</button></div>
        </div>
      )}

      {step === 2 && (
        <div>
          <div style={{ marginBottom: 18, textAlign: 'center' }}>
            <button className="btn btn-soft" onClick={function () { setAssessOpen(true); }}>🧭 不确定自己的水平？来做个 30 秒测评</button>
            {assessScore !== null && <span className="pill pill-ok" style={{ marginLeft: 10 }}>测评得分 {assessScore} 分</span>}
          </div>
          <div className="grid" style={{ gridTemplateColumns: 'repeat(5, 1fr)' }}>
            {LEVELS.map(function (lv) {
              return (
                <button key={lv.id} className={'pick-card' + (levelId === lv.id ? ' sel' : '')} onClick={function () { setLevelId(lv.id); }}>
                  <div className="pk-icon">{lv.icon}</div><b>{lv.name}</b><span>{lv.tag}</span>
                </button>
              );
            })}
          </div>
          {level && (
            <div className="card" style={{ marginTop: 20, padding: '16px 20px', display: 'flex', gap: 14, alignItems: 'center' }}>
              <span style={{ fontSize: 30 }}>{level.icon}</span>
              <div><b>{level.name}</b><p className="muted" style={{ fontSize: 13.5 }}>{level.desc}</p></div>
            </div>
          )}
          <div style={{ marginTop: 30, display: 'flex', gap: 12, justifyContent: 'center' }}>
            <button className="btn btn-ghost btn-lg" onClick={function () { setStep(1); }}>← 上一步</button>
            <button className="btn btn-primary btn-lg" onClick={function () { setStep(3); }}>下一步：精准画像 →</button>
          </div>
        </div>
      )}

      {step === 3 && (
        <div>
          <div className="grid" style={{ gridTemplateColumns: 'repeat(3, 1fr)' }}>
            {PERSONAS.map(function (p) {
              return (
                <button key={p.id} className={'pick-card' + (personaId === p.id ? ' sel' : '')} onClick={function () { setPersonaId(p.id); }}>
                  <div className="pk-icon">{p.icon}</div><b>{p.name}</b><span>{p.desc}</span>
                </button>
              );
            })}
          </div>
          {persona && (
            <div className="card bounce-in" style={{ marginTop: 22, padding: '20px 24px', textAlign: 'center' }}>
              <div style={{ fontSize: 30 }}>{persona.icon}</div>
              <h3 style={{ margin: '8px 0 4px' }}>{persona.name}学习画像 · {PERSONA_MOTTO[persona.id]}</h3>
              <div style={{ display: 'flex', gap: 8, justifyContent: 'center', flexWrap: 'wrap', marginTop: 10 }}>
                {persona.focus.map(function (f) { return <span key={f} className="tag" style={{ background: persona.color + '14', color: persona.color }}>{f}</span>; })}
              </div>
            </div>
          )}
          <div style={{ marginTop: 30, display: 'flex', gap: 12, justifyContent: 'center' }}>
            <button className="btn btn-ghost btn-lg" onClick={function () { setStep(2); }}>← 上一步</button>
            <button className="btn btn-primary btn-lg" onClick={finish}>生成我的学习路径 🚀</button>
          </div>
        </div>
      )}

      <Modal open={assessOpen} onClose={function () { setAssessOpen(false); }}>
        <h3 style={{ marginBottom: 6 }}>🧭 30 秒能力测评</h3>
        <p className="muted" style={{ fontSize: 13.5, marginBottom: 18 }}>如实作答，系统会推荐最合适的能力分层起点</p>
        {ASSESS.map(function (a, i) {
          return (
            <div key={i} className="field">
              <label>{i + 1}. {a.q}</label>
              <div style={{ display: 'grid', gap: 8 }}>
                {a.opts.map(function (o, j) {
                  return (
                    <button key={j} className="opt" style={answers[i] === j ? { borderColor: 'var(--brand)', background: 'var(--brand-soft)' } : {}}
                      onClick={function () { setAnswers(function (prev) { return prev.map(function (x, k) { return k === i ? j : x; }); }); }}>
                      <span className="opt-key">{'ABCD'[j]}</span>{o}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
        <button className="btn btn-primary btn-block" disabled={answers.some(function (a) { return a < 0; })} onClick={finishAssess}>完成测评，查看推荐起点</button>
      </Modal>
    </div>
  );
};
</script>
<script type="text/babel" data-presets="react">
/* ===== 课程体系 ===== */
const Courses = function () {
  const app = useApp();
  const currentUser = app.currentUser;
  const [params, setParams] = useSearchParams();
  const lang = params.get('lang') || 'all';
  const level = params.get('level') || 'all';
  const [kw, setKw] = useState('');

  const list = useMemo(function () {
    return COURSES
      .filter(function (c) { return (lang === 'all' || c.languageId === lang) && (level === 'all' || c.levelId === level); })
      .filter(function (c) {
        if (!kw.trim()) return true;
        const l = getLang(c.languageId);
        const lv = getLevel(c.levelId);
        return ((l ? l.name : '') + (lv ? lv.name : '') + c.tagline).indexOf(kw.trim()) >= 0;
      })
      .sort(function (a, b) {
        if (a.languageId === b.languageId) {
          return LEVELS.findIndex(function (x) { return x.id === a.levelId; }) - LEVELS.findIndex(function (x) { return x.id === b.levelId; });
        }
        return a.languageId.localeCompare(b.languageId);
      });
  }, [lang, level, kw]);

  const setFilter = function (k, v) {
    const next = new URLSearchParams(params);
    if (v === 'all') next.delete(k); else next.set(k, v);
    setParams(next, { replace: true });
  };

  return (
    <div className="container page" style={{ padding: '40px 24px 60px' }}>
      <h1 style={{ fontSize: 30 }}>课程体系</h1>
      <p className="muted" style={{ margin: '8px 0 24px' }}>按语言与能力分层浏览课程，登录后记录你的学习进度</p>

      <div className="card" style={{ padding: '18px 20px', marginBottom: 26 }}>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center', marginBottom: 12 }}>
          <span className="muted" style={{ fontSize: 13, fontWeight: 700 }}>语言</span>
          <button className={'pill' + (lang === 'all' ? ' pill-brand' : '')} style={{ cursor: 'pointer' }} onClick={function () { setFilter('lang', 'all'); }}>全部</button>
          {LANGUAGES.filter(function (l) { return !l.comingSoon; }).map(function (l) {
            return <button key={l.id} className={'pill' + (lang === l.id ? ' pill-brand' : '')} style={{ cursor: 'pointer' }} onClick={function () { setFilter('lang', l.id); }}>{l.flag} {l.name}</button>;
          })}
        </div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center' }}>
          <span className="muted" style={{ fontSize: 13, fontWeight: 700 }}>分级</span>
          <button className={'pill' + (level === 'all' ? ' pill-brand' : '')} style={{ cursor: 'pointer' }} onClick={function () { setFilter('level', 'all'); }}>全部</button>
          {LEVELS.map(function (lv) {
            return <button key={lv.id} className={'pill' + (level === lv.id ? ' pill-brand' : '')} style={{ cursor: 'pointer' }} onClick={function () { setFilter('level', lv.id); }}>{lv.icon} {lv.name}</button>;
          })}
        </div>
        <input className="input" style={{ marginTop: 14 }} placeholder="🔍 搜索课程关键词，如「英语」「高级」「语法」" value={kw} onChange={function (e) { setKw(e.target.value); }} />
      </div>

      {list.length === 0 ? (
        <EmptyState icon="🔭" title="没有找到匹配的课程" sub="换个筛选条件试试吧" />
      ) : (
        <div className="grid course">
          {list.map(function (c) {
            const l = getLang(c.languageId);
            const lv = getLevel(c.levelId);
            const pct = currentUser ? getCourseProgressPct(c.id, currentUser.progress.completed) : 0;
            const total = getLessonsOfCourse(c.id).length;
            return (
              <Link to={'/courses/' + c.id} key={c.id} className="course-card">
                <div className="cc-top">
                  <span className="pill" style={{ background: l.color + '1a', color: l.color, borderColor: 'transparent' }}>{l.flag} {l.name}</span>
                  <span className="pill pill-brand">{lv.icon} {lv.name}</span>
                </div>
                <div className="cc-title">{c.title}</div>
                <div className="cc-sub">{c.tagline}</div>
                <div className="cc-foot">
                  <span>📚 {total} 个课时 · {c.totalXp} XP</span>
                  {currentUser ? <span>{pct === 100 ? '✅ 已通关' : pct > 0 ? '已完成 ' + pct + '%' : '开始学习 →'}</span> : <span>🔒 登录解锁进度</span>}
                </div>
                {currentUser && pct > 0 && <div style={{ marginTop: 12 }}><ProgressBar pct={pct} color={l.color} /></div>}
              </Link>
            );
          })}
        </div>
      )}
    </div>
  );
};

/* ===== 课程详情 ===== */
const CourseDetail = function () {
  const params = useParams();
  const courseId = params.courseId;
  const app = useApp();
  const currentUser = app.currentUser;
  const navigate = useNavigate();
  const course = getCourse(courseId);

  if (!course) {
    return <div className="container page" style={{ paddingTop: 60 }}><EmptyState icon="🧭" title="课程不存在" sub="返回课程体系重新选择吧" /></div>;
  }

  const lang = getLang(course.languageId);
  const level = getLevel(course.levelId);
  const lessons = getLessonsOfCourse(course.id);
  const completed = currentUser ? currentUser.progress.completed : [];
  const doneCount = lessons.filter(function (l) { return completed.indexOf(l.id) >= 0; }).length;
  const pct = lessons.length ? Math.round((doneCount / lessons.length) * 100) : 0;
  const next = lessons.find(function (l) { return completed.indexOf(l.id) < 0; }) || lessons[0];

  const openLesson = function (lessonId) {
    if (!currentUser) { navigate('/login?next=/lesson/' + lessonId); return; }
    navigate('/lesson/' + lessonId);
  };

  return (
    <div className="container page" style={{ padding: '32px 24px 60px' }}>
      <div className="card" style={{ padding: '34px 30px', color: '#fff', marginBottom: 26, position: 'relative', overflow: 'hidden', background: 'radial-gradient(600px 300px at 90% -30%, ' + lang.color + '66, transparent 60%), linear-gradient(135deg, #1e1b4b, #312e81)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14 }}>
          <Link to="/courses" className="pill" style={{ background: 'rgba(255,255,255,0.14)', color: '#fff', border: '1px solid rgba(255,255,255,0.25)' }}>← 全部课程</Link>
          <span className="pill" style={{ background: 'rgba(255,255,255,0.14)', color: '#fff', border: '1px solid rgba(255,255,255,0.25)' }}>{lang.flag} {lang.name} · {lang.native}</span>
          <span className="pill" style={{ background: 'rgba(255,255,255,0.14)', color: '#fff', border: '1px solid rgba(255,255,255,0.25)' }}>{level.icon} {level.name}</span>
        </div>
        <h1 style={{ fontSize: 32 }}>{course.title}</h1>
        <p style={{ color: 'rgba(255,255,255,0.8)', margin: '10px 0 20px' }}>{course.tagline}</p>
        <div style={{ display: 'flex', alignItems: 'center', gap: 24, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontSize: 22, fontWeight: 800 }}>{doneCount} / {lessons.length}</div>
            <div style={{ fontSize: 12.5, color: 'rgba(255,255,255,0.6)' }}>已完成课时</div>
          </div>
          <div style={{ flex: 1, maxWidth: 320 }}><ProgressBar pct={pct} color="#fff" /></div>
          <button className="btn" style={{ background: '#fff', color: '#312e81', fontWeight: 800 }} onClick={function () { openLesson(next.id); }}>
            {pct >= 100 ? '🔄 复习课程' : doneCount > 0 ? '▶ 继续学习' : '🚀 开始学习'}
          </button>
        </div>
      </div>

      <h2 style={{ fontSize: 20, marginBottom: 16 }}>课程目录</h2>
      <div className="card" style={{ overflow: 'hidden' }}>
        {lessons.map(function (l, i) {
          const mod = getModule(l.type);
          const done = completed.indexOf(l.id) >= 0;
          const isNext = next && next.id === l.id;
          return (
            <div key={l.id} className="lesson-row" onClick={function () { openLesson(l.id); }} style={{ borderTop: i > 0 ? '1px solid var(--line)' : 'none' }}>
              <div className="li-icon" style={{ background: done ? 'var(--ok-soft)' : 'var(--brand-soft)' }}>{done ? '✅' : mod.icon}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="li-title">{i + 1}. {l.title}{isNext && <span className="pill pill-ok" style={{ marginLeft: 8 }}>推荐继续</span>}</div>
                <div className="li-sub">{l.subtitle}</div>
              </div>
              <div className="li-status">
                {done ? <span className="pill pill-ok">已完成</span> : <span className="pill" style={{ color: 'var(--brand)' }}>{mod.icon} {mod.name}</span>}
                <span className="muted" style={{ fontSize: 13 }}>→</span>
              </div>
            </div>
          );
        })}
      </div>

      {!currentUser && (
        <div className="card" style={{ marginTop: 22, padding: '20px 24px', display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
          <span style={{ fontSize: 26 }}>🔒</span>
          <div style={{ flex: 1 }}><b>登录后开始学习</b><p className="muted" style={{ fontSize: 13 }}>记录进度、获得 XP 与成就徽章</p></div>
          <Link to="/login" className="btn btn-primary">立即登录</Link>
          <Link to="/register" className="btn btn-ghost">免费注册</Link>
        </div>
      )}
    </div>
  );
};

/* ===== 课时播放 ===== */
const PLAYERS = { vocab: VocabularyPlayer, grammar: GrammarPlayer, listening: ListeningPlayer, speaking: SpeakingPlayer };

const LessonPage = function () {
  const params = useParams();
  const lessonId = params.lessonId;
  const app = useApp();
  const currentUser = app.currentUser;
  const recordActivity = app.recordActivity;
  const showToast = app.showToast;
  const lesson = getLesson(lessonId);

  const [activeTab, setActiveTab] = useState(lesson ? lesson.type : 'vocab');
  const [moduleDone, setModuleDone] = useState({ vocab: false, grammar: false, listening: false, speaking: false });
  const [confetti, setConfetti] = useState(false);
  const alreadyCompleted = useMemo(function () { return (currentUser && currentUser.progress.completed.indexOf(lessonId) >= 0) || false; }, [currentUser, lessonId]);
  const [completed, setCompleted] = useState(alreadyCompleted);

  if (!lesson || !getLang(lesson.languageId)) return <div className="container page" style={{ paddingTop: 80 }}>课时不存在</div>;
  const lang = getLang(lesson.languageId);
  const level = getLevel(lesson.levelId);

  const handleFinish = function (type) {
    if (moduleDone[type]) return;
    setModuleDone(function (prev) { var n = {}; n[type] = true; return { ...prev, ...n }; });
    const isFeatured = type === lesson.type;
    const deltas = { vocab: { words: 6, xp: 6 }, grammar: { grammar: 1, xp: 6 }, listening: { listening: 1, xp: 6 }, speaking: { speaking: 1, xp: 6 } }[type];

    const payload = { ...deltas, minutes: 1 };
    if (isFeatured && !completed) {
      payload.lessonId = lessonId;
      payload.completeLesson = true;
      payload.xp = deltas.xp + 20;
    }
    const newBadges = recordActivity(payload);

    if (isFeatured && !completed) {
      setCompleted(true);
      setConfetti(true);
      setTimeout(function () { setConfetti(false); }, 3200);
      showToast('🎓 课时完成！获得 ' + (deltas.xp + 20) + ' XP', 'success');
    } else {
      showToast('完成「' + getModule(type).name + '」+' + deltas.xp + ' XP', 'info');
    }
    newBadges.forEach(function (b) {
      const badge = BADGES.find(function (x) { return x.id === b; });
      if (badge) showToast('🏅 解锁成就「' + badge.name + '」', 'success');
    });
  };

  const courseLink = '/courses/' + lesson.courseId;
  const Player = PLAYERS[activeTab];
  const mod = getModule(activeTab);
  const tabContent = { vocab: { words: lesson.content.words }, grammar: lesson.content.grammar, listening: lesson.content.listening, speaking: lesson.content.speaking }[activeTab];

  return (
    <div className="container page" style={{ padding: '28px 24px 60px' }}>
      {confetti && <Confetti />}
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap', marginBottom: 20 }}>
        <Link to={courseLink} className="btn btn-ghost btn-sm">← 返回课程</Link>
        <span className="pill" style={{ background: lang.color + '1a', color: lang.color, borderColor: 'transparent' }}>{lang.flag} {lang.name}</span>
        <span className="pill pill-brand">{level.icon} {level.name}</span>
        {completed && <span className="pill pill-ok">✅ 本课已完成</span>}
      </div>
      <div className="card" style={{ padding: '24px 28px', marginBottom: 22 }}>
        <h1 style={{ fontSize: 24 }}>{lesson.title}</h1>
        <p className="muted" style={{ marginTop: 6 }}>{lesson.subtitle}</p>
        {completed && (
          <div style={{ marginTop: 12, maxWidth: 320 }}>
            <ProgressBar pct={100} />
            <span className="muted" style={{ fontSize: 12 }}>本课已通关，可反复练习巩固</span>
          </div>
        )}
      </div>
      <div className="learn-shell">
        <nav className="learn-nav">
          {MODULES.map(function (m) {
            const isActive = m.id === activeTab;
            const isFeatured = m.id === lesson.type;
            const done = moduleDone[m.id];
            return (
              <button key={m.id} className={'ln-item' + (isActive ? ' active' : '') + (done ? ' done' : '')}
                onClick={function () { stopSpeak(); setActiveTab(m.id); }}>
                <span>{m.icon}</span>
                <span>{m.name}{isFeatured && <span className="muted" style={{ fontSize: 11 }}> · 本节重点</span>}</span>
                <span className="ln-check">{done ? '✓' : isActive ? '●' : ''}</span>
              </button>
            );
          })}
          <div className="ln-item" style={{ pointerEvents: 'none', cursor: 'default', color: 'var(--muted)', fontSize: 12.5, lineHeight: 1.6 }}>
            💡 完成任意模块得 XP，完成「本节重点」即通关本课
          </div>
        </nav>
        <div className="learn-panel">
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
            <h3 style={{ fontSize: 19 }}>{mod.icon} {mod.name} <span className="muted" style={{ fontSize: 13, fontWeight: 400 }}>· {mod.desc}</span></h3>
            {moduleDone[activeTab] && <span className="pill pill-ok">已完成</span>}
          </div>
          <Player key={activeTab} lang={lang.tts} content={tabContent} words={lesson.content.words} onFinish={function () { handleFinish(activeTab); }} />
        </div>
      </div>
    </div>
  );
};
</script>
<script type="text/babel" data-presets="react">
/* ===== 学习中心 ===== */
const greeting = function () {
  const h = new Date().getHours();
  if (h < 6) return '夜深了';
  if (h < 9) return '早上好';
  if (h < 12) return '上午好';
  if (h < 14) return '中午好';
  if (h < 18) return '下午好';
  if (h < 22) return '晚上好';
  return '夜深了';
};

const WEEK_LABELS = { mon: '一', tue: '二', wed: '三', thu: '四', fri: '五', sat: '六', sun: '日' };
const WEEK_ORDER = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

const Dashboard = function () {
  const app = useApp();
  const currentUser = app.currentUser;
  if (!currentUser) return null;

  const progress = currentUser.progress;
  const lang = getLang(currentUser.langId);
  const persona = PERSONAS.find(function (p) { return p.id === currentUser.personaId; });
  const level = getLevelNameByXp(progress.xp);
  const nextLevel = LEVELS[LEVELS.indexOf(level) + 1];
  const levelPct = nextLevel ? Math.round(((progress.xp - level.xp) / (nextLevel.xp - level.xp)) * 100) : 100;

  const path = recommendCourses(currentUser);
  let continueLesson = null;
  for (let ci = 0; ci < path.length; ci++) {
    const lessons = getLessonsOfCourse(path[ci].id);
    const n = lessons.find(function (l) { return progress.completed.indexOf(l.id) < 0; });
    if (n) { continueLesson = { course: path[ci], lesson: n }; break; }
  }
  const pathProgress = path.map(function (c) { return { course: c, pct: getCourseProgressPct(c.id, progress.completed) }; });
  const weekMax = Math.max.apply(null, [1].concat(WEEK_ORDER.map(function (d) { return progress.week[d] || 0; })));
  const ownedBadges = BADGES.filter(function (b) { return progress.badges.indexOf(b.id) >= 0; });
  const lockedBadges = BADGES.filter(function (b) { return progress.badges.indexOf(b.id) < 0; });

  return (
    <div className="container page" style={{ padding: '32px 24px 60px' }}>
      <div className="dash-hero" style={{ marginBottom: 24 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 16 }}>
          <div>
            <div className="dh-greet">{greeting()}，{currentUser.name} {persona ? persona.icon : ''}</div>
            <div className="dh-sub">{persona ? persona.name + '画像' : ''} · 目标语言「{lang.flag} {lang.name}」 · {level.icon} 当前等级 {level.name}</div>
            {persona && <div className="dh-sub" style={{ marginTop: 4 }}>“{PERSONA_MOTTO[persona.id]}”</div>}
          </div>
          <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
            <span className="streak-flame">🔥 连续学习 {progress.streak} 天</span>
            <span className="streak-flame">⚡ {progress.xp} XP</span>
          </div>
        </div>
        <div style={{ maxWidth: 460, marginTop: 22 }}>
          {nextLevel ? (
            <div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, color: 'rgba(255,255,255,0.7)', marginBottom: 6 }}>
                <span>{level.icon} {level.name}</span>
                <span>距 {nextLevel.icon} {nextLevel.name} 还差 {nextLevel.xp - progress.xp} XP</span>
              </div>
              <ProgressBar pct={levelPct} color="#fff" />
            </div>
          ) : (
            <div className="dh-sub">已到达最高等级，你是语流的「大师级」学习者！</div>
          )}
        </div>
      </div>

      <div className="grid stat" style={{ marginBottom: 24 }}>
        <StatCard icon="📚" value={progress.stats.lessons} label="已完成课时" color="#4f46e5" />
        <StatCard icon="📦" value={progress.stats.words} label="已学单词" color="#06b6d4" />
        <StatCard icon="🧩" value={progress.stats.grammar} label="语法练习" color="#7c3aed" />
        <StatCard icon="🎧" value={progress.stats.listening + progress.stats.speaking} label="听口训练" color="#ec4899" />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1.5fr 1fr', gap: 22, alignItems: 'start' }}>
        <div>
          <SectionHead title="继续学习" sub="从上次中断的地方接着来" />
          {continueLesson ? (
            <div className="card card-hover" style={{ padding: 22, marginBottom: 26, border: '1.5px solid var(--brand)' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
                <div>
                  <span className="pill pill-brand">{getLang(continueLesson.course.languageId).flag} {getLevel(continueLesson.course.levelId).name}</span>
                  <h3 style={{ marginTop: 10 }}>{continueLesson.lesson.title}</h3>
                  <p className="muted" style={{ fontSize: 13 }}>{continueLesson.lesson.subtitle}</p>
                </div>
                <Link to={'/lesson/' + continueLesson.lesson.id} className="btn btn-primary btn-lg">▶ 立即学习</Link>
              </div>
              <div style={{ marginTop: 14 }}>
                <ProgressBar pct={pathProgress.find(function (p) { return p.course.id === continueLesson.course.id; }).pct} />
                <span className="muted" style={{ fontSize: 12 }}>课程总进度 {pathProgress.find(function (p) { return p.course.id === continueLesson.course.id; }).pct}%</span>
              </div>
            </div>
          ) : (
            <div className="card" style={{ marginBottom: 26 }}>
              <EmptyState icon="🎉" title="太棒了，所有推荐课程都已完成！" sub="去课程体系探索更多内容，或看看其他语言" />
            </div>
          )}

          <SectionHead title="我的个性化路径" sub={'依据「' + (persona ? persona.name : '兴趣') + '」画像与「' + level.name + '」能力定制'} />
          <div className="card" style={{ padding: 8 }}>
            {path.map(function (c, i) {
              const pct = pathProgress[i].pct;
              const l = getLang(c.languageId);
              return (
                <Link key={c.id} to={'/courses/' + c.id} className="lesson-row" style={{ borderTop: i > 0 ? '1px solid var(--line)' : 'none' }}>
                  <div className="li-icon" style={{ background: pct === 100 ? 'var(--ok-soft)' : 'var(--brand-soft)' }}>{pct === 100 ? '✅' : l.flag}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="li-title">{c.title}</div>
                    <div className="li-sub">{pct === 0 ? '尚未开始 · 建议按序学习' : '已完成 ' + pct + '%'}</div>
                    <div style={{ maxWidth: 260, marginTop: 6 }}><ProgressBar pct={pct} color={l.color} /></div>
                  </div>
                  <span className="muted" style={{ fontSize: 13 }}>{i === 0 ? '当前起点' : '第 ' + (i + 1) + ' 阶'} →</span>
                </Link>
              );
            })}
          </div>
        </div>

        <div>
          <SectionHead title="本周活动" sub={'本周已学习 ' + Object.keys(progress.week).reduce(function (a, k) { return a + (progress.week[k] || 0); }, 0) + ' 次'} />
          <div className="card" style={{ padding: 20, marginBottom: 26 }}>
            <div className="week-bars">
              {WEEK_ORDER.map(function (d) {
                const v = progress.week[d] || 0;
                return (
                  <div key={d} className="wb" title={v + ' 次学习'}>
                    <i style={{ height: Math.max(6, (v / weekMax) * 100) + '%' }} />
                    <span>周{WEEK_LABELS[d]}</span>
                  </div>
                );
              })}
            </div>
            <p className="muted center" style={{ fontSize: 12, marginTop: 12 }}>
              {progress.lastStudyDate === new Date().toDateString() ? '今天已打卡 ✓ 保持住！' : '今天还没学习，花 5 分钟打卡吧 🌱'}
            </p>
          </div>

          <SectionHead title="快捷训练" sub="碎片时间也能提升" />
          <div className="card" style={{ padding: 14, marginBottom: 26 }}>
            {path[0] && (
              <div style={{ display: 'grid', gap: 8 }}>
                {['vocab', 'grammar', 'listening', 'speaking'].map(function (t, i) {
                  const lesson = getLessonsOfCourse(path[0].id)[i];
                  if (!lesson) return null;
                  const icons = { vocab: '🃏', grammar: '✍️', listening: '🎧', speaking: '🎙️' };
                  const names = { vocab: '背单词', grammar: '刷语法', listening: '练听力', speaking: '说口语' };
                  return (
                    <Link key={t} to={'/lesson/' + lesson.id} className="lesson-row" style={{ borderRadius: 12 }}>
                      <span style={{ fontSize: 22 }}>{icons[t]}</span>
                      <span style={{ fontWeight: 700, fontSize: 14.5 }}>{names[t]}</span>
                      <span className="muted" style={{ marginLeft: 'auto', fontSize: 12.5 }}>5-8 分钟 →</span>
                    </Link>
                  );
                })}
              </div>
            )}
          </div>

          <SectionHead title="成就徽章" extra={<Link to="/profile" className="muted" style={{ fontSize: 13 }}>查看全部 →</Link>} />
          <div className="grid badge" style={{ gap: 10 }}>
            {ownedBadges.slice(0, 6).map(function (b) {
              return (
                <div key={b.id} className="badge-item" title={b.desc}>
                  <div className="b-icon">{b.icon}</div><b>{b.name}</b><span>{b.desc}</span>
                </div>
              );
            })}
            {lockedBadges.slice(0, 2).map(function (b) {
              return (
                <div key={b.id} className="badge-item locked" title={b.desc}>
                  <div className="b-icon">{b.icon}</div><b>{b.name}</b><span>未解锁</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
};

/* ===== 社区交流 ===== */
const Community = function () {
  const app = useApp();
  const db = app.db;
  const currentUser = app.currentUser;
  const toggleLike = app.toggleLike;
  const addPost = app.addPost;
  const addComment = app.addComment;
  const showToast = app.showToast;
  const [text, setText] = useState('');
  const [openComments, setOpenComments] = useState({});
  const [commentText, setCommentText] = useState({});
  const [activeFilter, setActiveFilter] = useState('hot');

  const posts = [].concat(db.posts).sort(function (a, b) {
    if (activeFilter === 'hot') return (b.baseLikes + b.likedBy.length) - (a.baseLikes + a.likedBy.length);
    return ((b.time === '刚刚' ? 1 : 0) - (a.time === '刚刚' ? 1 : 0));
  });

  const submitPost = function () {
    if (!text.trim()) return;
    const newBadges = addPost(text.trim());
    setText('');
    showToast('发布成功，你的分享会帮助更多人！', 'success');
    if (newBadges) newBadges.forEach(function () { showToast('🏅 解锁成就「社群之星」', 'success'); });
  };

  const submitComment = function (postId) {
    const t = (commentText[postId] || '').trim();
    if (!t) return;
    addComment(postId, t);
    setCommentText({ ...commentText, [postId]: '' });
    showToast('评论成功', 'info');
  };

  return (
    <div className="container page" style={{ padding: '40px 24px 60px', maxWidth: 820 }}>
      <h1 style={{ fontSize: 30 }}>社区交流</h1>
      <p className="muted" style={{ margin: '8px 0 24px' }}>分享经验、组队打卡、互相鼓励 —— 学习路上不孤单</p>

      {currentUser ? (
        <div className="card" style={{ padding: 18, marginBottom: 22 }}>
          <textarea className="textarea" placeholder={currentUser.name + '，分享你的学习心得、打卡进度或提问吧…'} value={text} onChange={function (e) { setText(e.target.value); }} />
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 12 }}>
            <span className="muted" style={{ fontSize: 12.5 }}>💡 真诚分享更容易获得同伴的回应</span>
            <button className="btn btn-primary" disabled={!text.trim()} onClick={submitPost}>发布动态</button>
          </div>
        </div>
      ) : (
        <div className="card" style={{ padding: '18px 22px', marginBottom: 22, display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
          <span style={{ fontSize: 24 }}>💬</span>
          <div style={{ flex: 1 }}><b>登录后即可参与社区交流</b><p className="muted" style={{ fontSize: 13 }}>发布动态可获得「社群之星」成就</p></div>
          <Link to="/login" className="btn btn-primary">登录</Link>
        </div>
      )}

      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <button className={'pill' + (activeFilter === 'hot' ? ' pill-brand' : '')} style={{ cursor: 'pointer' }} onClick={function () { setActiveFilter('hot'); }}>🔥 热门</button>
        <button className={'pill' + (activeFilter === 'new' ? ' pill-brand' : '')} style={{ cursor: 'pointer' }} onClick={function () { setActiveFilter('new'); }}>🕐 最新</button>
      </div>

      {posts.length === 0 ? (
        <EmptyState icon="🍃" title="还没有动态，来发第一条吧" sub="你的经验，是别人的灯塔" />
      ) : (
        posts.map(function (p) {
          const likes = p.baseLikes + p.likedBy.length;
          const liked = currentUser && p.likedBy.indexOf(currentUser.id) >= 0;
          const showCmts = openComments[p.id];
          return (
            <div key={p.id} className="post-card">
              <div className="post-head">
                <span className="avatar">{p.avatar}</span>
                <div><div className="ph-name">{p.authorName}</div><div className="ph-time">{p.time}</div></div>
              </div>
              <div className="post-body">{p.text}</div>
              <div className="post-actions">
                <button className="btn btn-ghost btn-sm" style={liked ? { background: 'var(--err-soft)', color: 'var(--err)', border: '1px solid #fecdca' } : {}}
                  onClick={function () { if (currentUser) toggleLike(p.id); else showToast('请先登录再点赞', 'info'); }}>
                  {liked ? '❤️ 已赞' : '🤍 点赞'} {likes > 0 && likes}
                </button>
                <button className="btn btn-ghost btn-sm" onClick={function () { setOpenComments({ ...openComments, [p.id]: !showCmts }); }}>💬 评论 {p.comments.length}</button>
              </div>
              {showCmts && (
                <div style={{ marginTop: 10 }}>
                  {p.comments.map(function (c) {
                    return (
                      <div key={c.id} className="comment">
                        <span className="avatar sm">{c.avatar}</span>
                        <div><b style={{ fontSize: 13 }}>{c.authorName}</b> <span className="muted" style={{ fontSize: 12 }}>{c.time}</span><div style={{ fontSize: 13.5 }}>{c.text}</div></div>
                      </div>
                    );
                  })}
                  {currentUser ? (
                    <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                      <input className="input" style={{ flex: 1, padding: '9px 12px', fontSize: 13.5 }} placeholder="友善评论，共同进步…" value={commentText[p.id] || ''} onChange={function (e) { setCommentText({ ...commentText, [p.id]: e.target.value }); }} />
                      <button className="btn btn-soft btn-sm" onClick={function () { submitComment(p.id); }}>发送</button>
                    </div>
                  ) : (
                    <p className="muted" style={{ fontSize: 12.5, marginTop: 10 }}><Link to="/login" style={{ color: 'var(--brand)', fontWeight: 700 }}>登录</Link> 后可参与评论</p>
                  )}
                </div>
              )}
            </div>
          );
        })
      )}
    </div>
  );
};

/* ===== 个人中心 ===== */
const Profile = function () {
  const app = useApp();
  const currentUser = app.currentUser;
  const updateProfile = app.updateProfile;
  const showToast = app.showToast;
  const logout = app.logout;
  const navigate = useNavigate();
  const [editing, setEditing] = useState(false);

  if (!currentUser || !form) return null;
  const progress = currentUser.progress;
  const level = getLevelNameByXp(progress.xp);
  const persona = getPersona(currentUser.personaId);
  const lang = getLang(currentUser.langId);

  const save = function () {
    updateProfile(form);
    setEditing(false);
    const lv = LEVELS.find(function (l) { return l.id === form.levelId; });
    showToast('画像已更新！学习起点：' + (lv ? lv.icon + ' ' + lv.name : '') + ' ✨', 'success');
  };

  const resetDemo = function () {
    localStorage.removeItem('linguaflow_db_v4');
    localStorage.removeItem('linguaflow_session');
    logout();
    window.location.href = '#/';
    window.location.reload();
  };

  const owned = BADGES.filter(function (b) { return progress.badges.indexOf(b.id) >= 0; });
  const locked = BADGES.filter(function (b) { return progress.badges.indexOf(b.id) < 0; });

  return (
    <div className="container page" style={{ padding: '36px 24px 60px', maxWidth: 980 }}>
      <div className="card" style={{ padding: '28px 30px', marginBottom: 24, display: 'flex', gap: 22, alignItems: 'center', flexWrap: 'wrap' }}>
        <div className="avatar" style={{ width: 72, height: 72, fontSize: 30 }}>{currentUser.avatar}</div>
        <div style={{ flex: 1, minWidth: 220 }}>
          <h1 style={{ fontSize: 24 }}>{currentUser.name}</h1>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 8 }}>
            <span className="pill pill-brand">{lang.flag} {lang.name}</span>
            <span className="pill pill-brand">{level.icon} {level.name}</span>
            <span className="pill">{persona.icon} {persona.name}画像</span>
            <span className="pill">🔥 {progress.streak} 天</span>
          </div>
          <p className="muted" style={{ fontSize: 12.5, marginTop: 8 }}>加入于 {new Date(currentUser.joinedAt).toLocaleDateString('zh-CN')} · 共学习 {progress.studyMins} 分钟</p>
        </div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button className="btn btn-ghost" onClick={function () { setEditing(!editing); }}>{editing ? '取消' : '调整画像'}</button>
          <button className="btn btn-ghost" style={{ color: 'var(--err)' }} onClick={resetDemo}>重置演示数据</button>
        </div>
      </div>

      {editing && (
        <div className="card bounce-in" style={{ padding: 24, marginBottom: 24 }}>
          <h3 style={{ marginBottom: 6 }}>调整学习画像（学习路径将随之更新）</h3>
          <p className="muted" style={{ fontSize: 12.5, marginBottom: 16 }}>
            说明：这里调整的是「能力起点」，用于生成个性化推荐路径；页面顶部的「当前等级」由累计 XP 自动决定，无需手动修改。
          </p>
          <div className="field">
            <label>目标语言</label>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {LANGUAGES.filter(function (l) { return !l.comingSoon; }).map(function (l) {
                return <button key={l.id} type="button" className={'pill' + (form.langId === l.id ? ' pill-brand' : '')} style={{ cursor: 'pointer', fontSize: 13.5 }} onClick={function () { setForm({ ...form, langId: l.id }); }}>{l.flag} {l.name}</button>;
              })}
            </div>
          </div>
          <div className="field">
            <label>能力起点</label>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {LEVELS.map(function (lv) {
                return <button key={lv.id} type="button" className={'pill' + (form.levelId === lv.id ? ' pill-brand' : '')} style={{ cursor: 'pointer' }} onClick={function () { setForm({ ...form, levelId: lv.id }); }}>{lv.icon} {lv.name}</button>;
              })}
            </div>
          </div>
          <div className="field">
            <label>精准画像</label>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {PERSONAS.map(function (p) {
                return <button key={p.id} type="button" className={'pill' + (form.personaId === p.id ? ' pill-brand' : '')} style={{ cursor: 'pointer' }} onClick={function () { setForm({ ...form, personaId: p.id }); }}>{p.icon} {p.name}</button>;
              })}
            </div>
          </div>
          <button className="btn btn-primary" onClick={save}>保存并重新匹配路径</button>
        </div>
      )}

      <div className="grid stat" style={{ marginBottom: 28 }}>
        <StatCard icon="⚡" value={progress.xp} label="累计 XP" color="#f59e0b" />
        <StatCard icon="📚" value={progress.stats.lessons} label="完成课时" color="#4f46e5" />
        <StatCard icon="📦" value={progress.stats.words} label="单词" color="#06b6d4" />
        <StatCard icon="🏅" value={owned.length} label={'成就 ' + owned.length + '/' + BADGES.length} color="#7c3aed" />
      </div>

      <SectionHead title="成就墙" sub={'已点亮 ' + owned.length + ' / ' + BADGES.length + ' 枚徽章'} />
      <div className="grid badge" style={{ gap: 12, marginBottom: 28 }}>
        {BADGES.map(function (b) {
          const got = progress.badges.indexOf(b.id) >= 0;
          return (
            <div key={b.id} className={'badge-item' + (got ? '' : ' locked')} title={b.desc}>
              <div className="b-icon">{b.icon}</div><b>{b.name}</b><span>{got ? b.desc : '未解锁'}</span>
            </div>
          );
        })}
      </div>

      {locked.length > 0 && (
        <div className="card" style={{ padding: '18px 22px', display: 'flex', alignItems: 'center', gap: 12 }}>
          <span style={{ fontSize: 24 }}>🎯</span>
          <p className="ink2" style={{ fontSize: 13.5 }}>下一枚可解锁徽章：<b>{locked[0].name}</b>（{locked[0].desc}）。去学习中心继续努力吧！</p>
          <button className="btn btn-primary btn-sm" style={{ marginLeft: 'auto' }} onClick={function () { navigate('/dashboard'); }}>去学习 →</button>
        </div>
      )}
    </div>
  );
};

/* ===== 路由与应用 ===== */
const ScrollToTop = function () {
  const location = useLocation();
  useEffect(function () { window.scrollTo(0, 0); }, [location.pathname]);
  return null;
};

const ToastHost = function () {
  const app = useApp();
  const toasts = app.toasts;
  return (
    <div className="toast-wrap">
      {toasts.map(function (t) {
        return <div key={t.id} className={'toast ' + t.type}><span>{t.type === 'success' ? '🎉' : t.type === 'info' ? '💡' : '✅'}</span>{t.msg}</div>;
      })}
    </div>
  );
};

const RequireAuth = function ({ children }) {
  const app = useApp();
  const currentUser = app.currentUser;
  if (!currentUser) return <Navigate to="/login" replace />;
  return children;
};

const App = function () {
  return (
    <div>
      <ScrollToTop />
      <ToastHost />
      <Routes>
        <Route element={<Layout />}>
          <Route path="/" element={<Home />} />
          <Route path="/login" element={<Login />} />
          <Route path="/register" element={<Register />} />
          <Route path="/onboarding" element={<RequireAuth><Onboarding /></RequireAuth>} />
          <Route path="/courses" element={<Courses />} />
          <Route path="/courses/:courseId" element={<CourseDetail />} />
          <Route path="/lesson/:lessonId" element={<RequireAuth><LessonPage /></RequireAuth>} />
          <Route path="/dashboard" element={<RequireAuth><Dashboard /></RequireAuth>} />
          <Route path="/community" element={<Community />} />
          <Route path="/profile" element={<RequireAuth><Profile /></RequireAuth>} />
          <Route path="*" element={<Navigate to="/" replace />} />
        </Route>
      </Routes>
    </div>
  );
};

/* ===== 渲染入口（HashRouter 支持本地双击打开）===== */
(function () {
  try {
    ReactDOM.createRoot(document.getElementById('root')).render(
      <React.StrictMode>
        <HashRouter>
          <AppProvider>
            <App />
          </AppProvider>
        </HashRouter>
      </React.StrictMode>
    );
  } catch (err) {
    var d = document.getElementById('root');
    if (d) d.innerHTML = '<div style="padding:36px 28px;font-family:sans-serif;max-width:860px;margin:0 auto"><h3 style="color:#ef4444">⚠ 启动失败</h3><b>' + LF_esc(err && err.message) + '</b><pre>' + LF_esc(err && err.stack) + '</pre></div>';
  }
})();
</script>
